services:
  monacloud-mcp-remote:
    build:
      context: ../..
      dockerfile: Dockerfile.remote
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env.remote
    environment:
      MCP_REMOTE_BIND: 0.0.0.0
      MCP_REMOTE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
